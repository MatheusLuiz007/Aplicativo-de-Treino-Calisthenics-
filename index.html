<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird - Deluxe Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            border: 6px solid #333;
            border-radius: 12px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.7);
            background: #70c5ce;
        }

        canvas {
            display: block;
            border-radius: 6px;
        }

        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            color: white;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .ui-screen h1 {
            font-size: 42px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 3px 3px 0px #000;
            color: #f7d346;
        }

        .ui-screen p {
            font-size: 16px;
            margin-bottom: 25px;
            color: #ddd;
            text-shadow: 1px 1px 2px #000;
        }

        .play-btn {
            padding: 12px 28px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(#ff6b4a, #ff4500);
            border: 3px solid #fff;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 6px 0 #b33000, 0 8px 15px rgba(0,0,0,0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .play-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b33000, 0 4px 6px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <div id="ui-overlay" class="ui-screen">
            <h1 id="ui-title">Flappy Bird</h1>
            <p id="ui-text">Pressione Espaço ou Toque na tela para voar</p>
            <button id="ui-btn" class="play-btn">Jogar</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiOverlay = document.getElementById('ui-overlay');
        const uiTitle = document.getElementById('ui-title');
        const uiText = document.getElementById('ui-text');
        const uiBtn = document.getElementById('ui-btn');

                // Configurações Físicas Ajustadas para o MODO HARD
        const CONFIG = {
            gravity: 28.5,       // Gravidade muito mais pesada (queda rápida)
            jump: -460,          // Pulo seco e veloz para compensar a gravidade
            maxFallSpeed: 850,   // Velocidade terminal aumentada
            pipeSpeed: 240,      // Canos se movem muito mais rápido na tela
            pipeGap: 105,        // Vão extremamente estreito (margem de erro mínima!)
            pipeMinHeight: 70,    
            pipeDistance: 190,    // Canos muito mais próximos uns dos outros (ritmo frenético)
            floorHeight: 80
        };

        // Classe encapsulando a estrutura de cada par de Canos (Geração Hardcore)
        class Pipe {
            constructor(startX) {
                this.x = startX;
                this.width = 70; // Canos ligeiramente mais largos para exigir maior tempo de passagem
                this.passed = false;

                const availableSpace = canvas.height - CONFIG.floorHeight - CONFIG.pipeGap;
                
                // Algoritmo de altura com variações mais agressivas entre canos consecutivos
                this.topHeight = Math.floor(Math.random() * (availableSpace - CONFIG.pipeMinHeight * 2)) + CONFIG.pipeMinHeight;
                this.bottomHeight = canvas.height - CONFIG.floorHeight - CONFIG.pipeGap - this.topHeight;
            }

            update(dt) {
                this.x -= CONFIG.pipeSpeed * dt;
            }

            // O restante dos métodos da classe Pipe (checkCollision, draw, etc) continuam idênticos


        let game = {
            birdY: 250,
            birdVelocity: 0,
            birdRotation: 0,
            pipes: [],
            score: 0,
            highScore: localStorage.getItem('flappy_highscore') || 0,
            isPlaying: false,
            bgScroll: 0,
            floorScroll: 0
        };

        function initGame() {
            game.birdY = 250;
            game.birdVelocity = 0;
            game.birdRotation = 0;
            game.score = 0;
            game.pipes = [];
            game.isPlaying = true;

            spawnPipe(450);

            uiOverlay.style.opacity = 0;
            setTimeout(() => uiOverlay.style.display = 'none', 300);
        }

        function spawnPipe(startX = 400) {
            const containerHeight = canvas.height - 80; 
            const availableSpace = containerHeight - CONFIG.pipeGap;
            
            const topHeight = Math.floor(Math.random() * (availableSpace - CONFIG.pipeMinHeight * 2)) + CONFIG.pipeMinHeight;
            const bottomHeight = containerHeight - CONFIG.pipeGap - topHeight;

            game.pipes.push({
                x: startX,
                topHeight: topHeight,
                bottomHeight: bottomHeight,
                width: 65,
                passed: false
            });
        }

        function flap() {
            if (!game.isPlaying) return;
            game.birdVelocity = CONFIG.jump;
        }

        function gameOver() {
            game.isPlaying = false;
            if (game.score > game.highScore) {
                game.highScore = game.score;
                localStorage.setItem('flappy_highscore', game.highScore);
            }

            uiTitle.textContent = "Game Over";
            uiText.innerHTML = `Pontos: <strong>${game.score}</strong> | Recorde: <strong>${game.highScore}</strong>`;
            uiBtn.textContent = "Jogar Novamente";
            
            uiOverlay.style.display = 'flex';
            setTimeout(() => uiOverlay.style.opacity = 1, 10);
        }

        function drawBackground() {
            let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, '#4ec0ca');
            skyGrad.addColorStop(0.7, '#a1e4ec');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            game.bgScroll = (game.bgScroll + 0.4) % 400;
            for (let i = 0; i < 2; i++) {
                let cx = (i * 250) - game.bgScroll;
                ctx.beginPath();
                ctx.arc(cx + 40, 420, 30, 0, Math.PI * 2);
                ctx.arc(cx + 80, 410, 40, 0, Math.PI * 2);
                ctx.arc(cx + 130, 420, 30, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawFloor() {
            const floorY = canvas.height - 80;
            game.floorScroll = game.isPlaying ? (game.floorScroll + CONFIG.pipeSpeed) % 24 : game.floorScroll;

            ctx.fillStyle = '#ded895';
            ctx.fillRect(0, floorY, canvas.width, 80);

            ctx.fillStyle = '#73c73a';
            ctx.fillRect(0, floorY, canvas.width, 14);

            ctx.fillStyle = '#539e22';
            ctx.fillRect(0, floorY + 14, canvas.width, 3);

            ctx.fillStyle = '#539e22';
            for (let i = -24; i < canvas.width + 24; i += 24) {
                ctx.beginPath();
                ctx.moveTo(i - game.floorScroll, floorY);
                ctx.lineTo(i - game.floorScroll + 12, floorY + 14);
                ctx.lineTo(i - game.floorScroll + 6, floorY + 14);
                ctx.lineTo(i - game.floorScroll - 6, floorY);
                ctx.fill();
            }
        }

        function drawBird() {
            ctx.save();
            ctx.translate(80, game.birdY);
            ctx.rotate(game.birdRotation);

            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.beginPath();
            ctx.arc(-2, 4, 17, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#f7d346';
            ctx.strokeStyle = '#332600';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, 16, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#fffb91';
            ctx.beginPath();
            ctx.arc(-3, 3, 11, 0.2, Math.PI);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(-7, -1, 9, 6, Math.PI / 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(6, -4, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(7, -4, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#f75324';
            ctx.beginPath();
            ctx.moveTo(13, -2);
            ctx.quadraticCurveTo(24, -2, 22, 3);
            ctx.quadraticCurveTo(13, 8, 11, 3);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.restore();
        }

        function drawPipes() {
            game.pipes.forEach(p => {
                let pipeGrad = ctx.createLinearGradient(p.x, 0, p.x + p.width, 0);
                pipeGrad.addColorStop(0, '#73c83b');
                pipeGrad.addColorStop(0.3, '#a3fe68');
                pipeGrad.addColorStop(0.8, '#529e21');
                pipeGrad.addColorStop(1, '#376813');

                ctx.fillStyle = pipeGrad;
                ctx.strokeStyle = '#1e3c05';
                ctx.lineWidth = 3.5;

                ctx.fillRect(p.x, 0, p.width, p.topHeight);
                ctx.strokeRect(p.x, -5, p.width, p.topHeight + 5);

                ctx.fillRect(p.x - 4, p.topHeight - 24, p.width + 8, 24);
                ctx.strokeRect(p.x - 4, p.topHeight - 24, p.width + 8, 24);

                const bottomY = canvas.height - 80 - p.bottomHeight;
                ctx.fillRect(p.x, bottomY, p.width, p.bottomHeight);
                ctx.strokeRect(p.x, bottomY, p.width, p.bottomHeight + 5);

                ctx.fillRect(p.x - 4, bottomY, p.width + 8, 24);
                ctx.strokeRect(p.x - 4, bottomY, p.width + 8, 24);
            });
        }

        function drawScore() {
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 6;
            ctx.font = 'bold 48px Arial';
                        ctx.textAlign = 'center';
            ctx.lineJoin = 'round';
            
            ctx.strokeText(game.score, canvas.width / 2, 65);
            ctx.fillText(game.score, canvas.width / 2, 65);
        }

        function update() {
            drawBackground();

            if (game.isPlaying) {
                game.birdVelocity += CONFIG.gravity;
                game.birdVelocity = Math.min(game.birdVelocity, CONFIG.maxFallSpeed);
                game.birdY += game.birdVelocity;

                if (game.birdVelocity < 0) {
                    game.birdRotation = Math.max(-0.4, game.birdRotation - 0.08);
                } else if (game.birdVelocity > 3) {
                    game.birdRotation = Math.min(1.2, game.birdRotation + 0.08);
                }

                if (game.birdY + 14 >= canvas.height - 80) {
                    gameOver();
                }

                for (let i = game.pipes.length - 1; i >= 0; i--) {
                    let p = game.pipes[i];
                    p.x -= CONFIG.pipeSpeed;

                    if (!p.passed && p.x + p.width / 2 < 80) {
                        p.passed = true;
                        game.score++;
                    }

                    let bRadius = 13;
                    if (80 + bRadius > p.x && 80 - bRadius < p.x + p.width) {
                        if (game.birdY - bRadius < p.topHeight) {
                            gameOver();
                        }
                        if (game.birdY + bRadius > canvas.height - 80 - p.bottomHeight) {
                            gameOver();
                        }
                    }

                    if (p.x < -p.width - 10) {
                        game.pipes.splice(i, 1);
                    }
                }

                if (game.pipes.length > 0) {
                    let lastPipe = game.pipes[game.pipes.length - 1];
                    if (lastPipe.x < canvas.width - CONFIG.pipeDistance) {
                        spawnPipe();
                    }
                }
            }

            drawPipes();
            drawFloor();
            drawBird();
            if (game.isPlaying) drawScore();

            requestAnimationFrame(update);
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (game.isPlaying) flap();
                else if (uiOverlay.style.opacity == 1 || uiOverlay.style.display !== 'none') initGame();
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (game.isPlaying) flap();
        }, { passive: false });

        canvas.addEventListener('mousedown', (e) => {
            if (game.isPlaying) flap();
        });

        uiBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            initGame();
        });

        requestAnimationFrame(update);
    </script>
</body>
</html>
